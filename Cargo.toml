[package]
name = "sqcli"
version = "1.1.0"
edition = "2021"
authors = ["Seismiq Developers"]
homepage = "https://seismiq.net"
description = "Command line tool to access seismiq sensors"
license = "MIT"
readme = "README.md"

[dependencies]
cidr = "0.3.0"
local-ip-address = "0.6.3"
reqwest = { version = "0.12.9", features = ["json", "stream"] }
tokio = { version = "1.0.0", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
futures = "0.3.31"
log = "0.4.22"
env_logger = "0.11.5"
clap = { version = "4.5.23", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.133"
dotenvy = "0.15.7"
sensor_api = {path = "sensor-api" }
chrono = "0.4.39"
eyre = "0.6.12"
color-eyre = "0.6.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
base64 = "0.23.1"
flate2 = "1.1.10"
